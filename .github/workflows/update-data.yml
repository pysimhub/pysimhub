name: Update Data

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'static/data/projects/**'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    # Skip if triggered by bot to prevent loops
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Fetch repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: node scripts/fetch-github-data.js
        timeout-minutes: 5

      - name: Download external logos
        run: node scripts/download-logos.js

      - name: Sync issue templates
        run: node scripts/sync-issue-templates.js

      - name: Install dependencies
        run: npm ci

      - name: Generate embeddings
        run: node scripts/generate-embeddings.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add static/data/github-cache.json static/data/projects/ static/data/embeddings.json static/logos/ .github/ISSUE_TEMPLATE/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update GitHub data cache"
          git pull --rebase origin main
          git push
