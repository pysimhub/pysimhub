name: Process Project Submission

on:
  issues:
    types: [labeled, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

# Scope concurrency to the issue: a re-trigger (edit/relabel) for the same
# issue supersedes its own in-flight run, while different issues run in
# parallel. Per-file project storage means concurrent issues never conflict.
concurrency:
  group: submission-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

jobs:
  process-submission:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'submission') &&
       !contains(github.event.issue.labels.*.name, 'pr-created'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get issue data
        id: issue
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = context.payload.inputs?.issue_number || context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber)
            });
            core.setOutput('number', issue.number);
            core.setOutput('author', issue.user.login);
            core.setOutput('body', issue.body);

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Process submission
        id: process
        env:
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
        run: node scripts/process-submission.js
        continue-on-error: true

      - name: Comment on issue (processing error)
        if: steps.process.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            let msg = 'Unknown error occurred.';
            try { msg = fs.readFileSync('process-error.txt', 'utf-8').trim() || msg; } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `❌ **Error processing submission**\n\n${msg}\n\nEdit the issue to fix this and it will be reprocessed automatically.`
            });

      - name: Fail if processing error
        if: steps.process.outcome == 'failure'
        run: exit 1

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: submission/${{ steps.process.outputs.id }}-${{ steps.issue.outputs.number }}
          delete-branch: true
          title: "Add ${{ steps.process.outputs.name }} to PySimHub"
          body: |
            ## New Project: ${{ steps.process.outputs.name }}

            Submitted by @${{ steps.issue.outputs.author }} in #${{ steps.issue.outputs.number }}

            **Tagline:** ${{ steps.process.outputs.tagline }}
            **Tags:** ${{ steps.process.outputs.tags }}
            **Repository:** ${{ steps.process.outputs.github }}

            ---
            Closes #${{ steps.issue.outputs.number }}
          commit-message: "Add ${{ steps.process.outputs.name }} to projects"
          add-paths: static/data/projects

      - name: Comment on issue (success)
        if: steps.pr.outputs.pull-request-number
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              body: `🎉 **Thanks for your submission!**\n\nPR created: ${{ steps.pr.outputs.pull-request-url }}\n\nA maintainer will review it shortly.`
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              labels: ['pr-created']
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              title: `[Submission] ${{ steps.process.outputs.name }}`
            });

      - name: Comment on issue (unexpected failure)
        if: failure() && steps.process.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              body: `❌ **Unexpected error**\n\nSomething went wrong while creating the PR.\n\nSee the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            });
